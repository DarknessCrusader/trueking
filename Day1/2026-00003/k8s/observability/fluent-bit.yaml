apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/wsc2026-book-*_wsc2026_*.log
        Tag               app
        Refresh_Interval  5
        Read_from_Head    true
        Parser            cri

    [FILTER]
        Name         grep
        Match        app
        Exclude      log /health

    [FILTER]
        Name         grep
        Match        app
        Regex        log access

    [FILTER]
        Name         parser
        Match        app
        Key_Name     log
        Parser       app_log
        Reserve_Data Off

    # status -> level 결정 및 채점 포맷(순수 JSON, 필드순서 level,path,status,duration,method) 한 줄 생성
    [FILTER]
        Name    lua
        Match   app
        script  /fluent-bit/etc/reformat.lua
        call    reformat

    # log_key message -> record 전체가 아니라 message 값(한 줄 JSON 문자열)만 전송
    [OUTPUT]
        Name              cloudwatch_logs
        Match             app
        region            ap-northeast-2
        log_group_name    /wsc2026/app/book
        log_stream_prefix book-
        auto_create_group true
        log_key           message

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        app_log
        Format      regex
        Regex       ^(?<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) access method=(?<method>\S+) path=(?<path>\S+) status=(?<status>\d+) duration=(?<duration>\S+) remote_addr=(?<remote_addr>\S+) user_agent=.*$

  reformat.lua: |
    -- status 코드 기반으로 level 결정, 필드 순서를 level,path,status,duration,method 로 고정하여
    -- 순수 JSON 한 줄을 message 키에 담아 반환한다. (Grafana가 level 필드로 레벨 뱃지 자동 표시)
    function reformat(tag, timestamp, record)
        local status   = tostring(record["status"]   or "")
        local path     = tostring(record["path"]     or "")
        local duration = tostring(record["duration"] or "")
        local method   = tostring(record["method"]   or "")

        local level = "INFO"
        local code = tonumber(status)
        if code ~= nil then
            if code >= 500 then
                level = "ERROR"
            elseif code >= 400 then
                level = "WARN"
            end
        end

        local new = {}
        new["message"] = string.format(
            '{"level":"%s","path":"%s","status":"%s","duration":"%s","method":"%s"}',
            level, path, status, duration, method)
        return 1, timestamp, new
    end
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit-sa
      containers:
        - name: fluent-bit
          image: amazon/aws-for-fluent-bit:latest
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
